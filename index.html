<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c26;
    --border: #2a2a3a;
    --accent: #ff6b2b;
    --accent2: #ffb347;
    --gold: #ffd700;
    --text: #f0f0f5;
    --muted: #7070a0;
    --success: #4ade80;
    --danger: #f87171;
    --radius: 12px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  .screen { display: none; min-height: 100vh; position: relative; z-index: 1; }
  .screen.active { display: flex; flex-direction: column; }

  /* SETUP */
  #setup-screen { align-items: center; justify-content: center; padding: 2rem; background: radial-gradient(ellipse at 50% 0%, rgba(255,107,43,0.15) 0%, transparent 70%); }
  .logo-area { text-align: center; margin-bottom: 2.5rem; animation: fadeUp 0.8s ease both; }
  .logo-area .badge { display: inline-block; background: rgba(255,107,43,0.15); border: 1px solid rgba(255,107,43,0.3); color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 3px; padding: 6px 16px; border-radius: 20px; margin-bottom: 1.2rem; text-transform: uppercase; }
  .logo-area h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3.5rem, 10vw, 6rem); letter-spacing: 4px; line-height: 0.9; background: linear-gradient(135deg, #fff 40%, var(--accent) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .logo-area p { color: var(--muted); font-size: 0.95rem; margin-top: 0.8rem; letter-spacing: 1px; }
  .setup-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 2rem; width: 100%; max-width: 440px; animation: fadeUp 0.8s 0.2s ease both; }
  .setup-card h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 2px; margin-bottom: 0.4rem; }
  .setup-card > p { color: var(--muted); font-size: 0.82rem; margin-bottom: 1.5rem; line-height: 1.6; }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; font-size: 0.75rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-bottom: 0.4rem; }
  .form-group input { width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; outline: none; transition: border-color 0.2s; }
  .form-group input:focus { border-color: var(--accent); }
  .form-group input::placeholder { color: var(--muted); }
  .api-hint { font-size: 0.72rem; color: var(--muted); margin-top: 0.4rem; }
  .api-hint a { color: var(--accent); text-decoration: none; }
  .btn-primary { width: 100%; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 2px; padding: 14px; border: none; border-radius: var(--radius); cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; margin-top: 0.8rem; }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(255,107,43,0.4); }

  /* TOP BAR */
  .top-bar { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.2rem; border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0; z-index: 10; }
  .top-bar .logo-sm { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 3px; background: linear-gradient(135deg, #fff, var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .xp-pill { display: flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px; font-family: 'JetBrains Mono', monospace; font-size: 0.82rem; }
  .xp-pill .xp-val { color: var(--gold); font-weight: 700; }

  /* HOME */
  #home-screen { padding: 0; }
  .home-content { padding: 1.2rem; flex: 1; overflow-y: auto; padding-bottom: 90px; }
  .greeting { margin-bottom: 1.5rem; animation: fadeUp 0.5s ease both; }
  .greeting h2 { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 2px; line-height: 1; }
  .greeting p { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .level-card { background: linear-gradient(135deg, rgba(255,107,43,0.1), rgba(255,179,71,0.05)); border: 1px solid rgba(255,107,43,0.3); border-radius: 16px; padding: 1.2rem; margin-bottom: 1.2rem; animation: fadeUp 0.5s 0.1s ease both; }
  .level-card .level-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem; }
  .level-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 2px; color: var(--accent); }
  .level-badge { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--gold); background: rgba(255,215,0,0.1); border: 1px solid rgba(255,215,0,0.3); padding: 3px 8px; border-radius: 8px; }
  .xp-bar-wrap { height: 7px; background: var(--surface2); border-radius: 10px; overflow: hidden; }
  .xp-bar { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 10px; transition: width 0.6s ease; }
  .xp-label { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); margin-top: 5px; font-family: 'JetBrains Mono', monospace; }
  .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 2px; color: var(--muted); margin-bottom: 0.8rem; margin-top: 1.5rem; }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin-bottom: 0.5rem; animation: fadeUp 0.5s 0.2s ease both; }
  .stat-box { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.8rem; text-align: center; }
  .stat-box .stat-icon { font-size: 1.3rem; margin-bottom: 3px; }
  .stat-box .stat-val { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 1px; }
  .stat-box .stat-lbl { font-size: 0.65rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .scenarios-grid { display: flex; flex-direction: column; gap: 0.8rem; animation: fadeUp 0.5s 0.3s ease both; }
  .scenario-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1rem 1.2rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 1rem; position: relative; overflow: hidden; }
  .scenario-card::before { content: ''; position: absolute; top: 0; left: 0; bottom: 0; width: 3px; background: var(--accent); opacity: 0; transition: opacity 0.2s; }
  .scenario-card:hover { border-color: var(--accent); transform: translateX(4px); }
  .scenario-card:hover::before { opacity: 1; }
  .scenario-icon { font-size: 1.8rem; flex-shrink: 0; }
  .scenario-info { flex: 1; }
  .scenario-info h3 { font-size: 0.92rem; font-weight: 600; margin-bottom: 2px; }
  .scenario-info p { font-size: 0.75rem; color: var(--muted); line-height: 1.4; }
  .scenario-meta { text-align: right; flex-shrink: 0; }
  .scenario-xp { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--gold); }
  .scenario-diff { font-size: 0.65rem; color: var(--muted); margin-top: 2px; }

  /* CALL SCREEN */
  #call-screen { background: radial-gradient(ellipse at 50% 100%, rgba(255,107,43,0.08) 0%, transparent 60%); }
  .call-header { padding: 1rem 1.2rem; border-bottom: 1px solid var(--border); background: var(--surface); display: flex; align-items: center; gap: 0.8rem; }
  .btn-back { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: 10px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.2s; }
  .btn-back:hover { background: var(--border); }
  .call-header-info { flex: 1; }
  .call-header-info h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 2px; }
  .call-header-info p { font-size: 0.7rem; color: var(--muted); }
  .call-status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); flex-shrink: 0; transition: background 0.3s; }
  .call-status-dot.active { background: var(--success); animation: pulse 1.5s infinite; }
  .call-status-dot.recording { background: var(--danger); animation: pulse 1s infinite; }
  .call-body { flex: 1; overflow-y: auto; padding: 1.2rem; display: flex; flex-direction: column; gap: 0.8rem; padding-bottom: 200px; }
  .prospect-avatar { text-align: center; padding: 1.5rem 0 0.8rem; animation: fadeUp 0.4s ease both; }
  .avatar-circle { width: 80px; height: 80px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 2.2rem; margin: 0 auto 0.8rem; border: 3px solid rgba(255,107,43,0.3); position: relative; }
  .avatar-circle.speaking::after { content: ''; position: absolute; inset: -8px; border-radius: 50%; border: 2px solid var(--accent); animation: ripple 1.5s infinite; }
  .prospect-avatar h3 { font-family: 'Bebas Neue', sans-serif; font-size: 1.3rem; letter-spacing: 2px; }
  .prospect-avatar p { color: var(--muted); font-size: 0.78rem; }
  .msg { display: flex; gap: 0.6rem; animation: fadeUp 0.3s ease both; max-width: 85%; }
  .msg.user { flex-direction: row-reverse; align-self: flex-end; }
  .msg-bubble { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 0.7rem 1rem; font-size: 0.87rem; line-height: 1.5; }
  .msg.user .msg-bubble { background: rgba(255,107,43,0.12); border-color: rgba(255,107,43,0.3); }
  .msg-name { font-size: 0.65rem; color: var(--muted); margin-bottom: 3px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
  .thinking { display: flex; gap: 4px; padding: 10px 14px; }
  .thinking span { width: 7px; height: 7px; background: var(--muted); border-radius: 50%; animation: bounce 1.2s infinite; }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  .call-controls { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); padding: 1rem 1.2rem 1.5rem; display: flex; flex-direction: column; gap: 0.8rem; z-index: 10; }
  .voice-status { text-align: center; font-size: 0.75rem; color: var(--muted); font-family: 'JetBrains Mono', monospace; min-height: 18px; }
  .controls-row { display: flex; align-items: center; justify-content: center; gap: 1rem; }
  .ctrl-btn { border: none; cursor: pointer; border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; font-size: 1.2rem; }
  .ctrl-btn.sm { width: 46px; height: 46px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
  .ctrl-btn.sm:hover { background: var(--border); }
  .ctrl-btn.main { width: 68px; height: 68px; background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #000; box-shadow: 0 0 30px rgba(255,107,43,0.4); }
  .ctrl-btn.main:hover { transform: scale(1.05); }
  .ctrl-btn.main.recording { background: linear-gradient(135deg, var(--danger), #ff4444); box-shadow: 0 0 30px rgba(248,113,113,0.5); }
  .ctrl-btn.end { background: rgba(248,113,113,0.15); border: 1px solid var(--danger); color: var(--danger); }
  .transcript-bar { display: flex; align-items: center; gap: 8px; padding: 0.5rem 0.8rem; background: var(--surface2); border-radius: 10px; font-size: 0.78rem; color: var(--muted); min-height: 34px; }
  .transcript-bar .live-text { flex: 1; font-style: italic; color: var(--text); }

  /* TEXT INPUT FALLBACK */
  .text-input-row { display: flex; gap: 8px; }
  .text-input-row input { flex: 1; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 12px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.85rem; outline: none; }
  .text-input-row input:focus { border-color: var(--accent); }
  .text-input-row button { background: var(--accent); border: none; border-radius: var(--radius); padding: 10px 16px; color: #000; font-weight: 700; cursor: pointer; font-size: 0.9rem; }

  /* BOOKS */
  #books-screen { padding: 0; }
  .screen-header { padding: 1rem 1.2rem; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.8rem; }
  .screen-header h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 2px; }
  .books-content { padding: 1.2rem; overflow-y: auto; flex: 1; padding-bottom: 90px; }
  .book-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; margin-bottom: 0.8rem; cursor: pointer; transition: all 0.2s; }
  .book-card:hover { border-color: var(--accent); }
  .book-card.read { border-color: rgba(74,222,128,0.3); }
  .book-card .book-top { display: flex; align-items: flex-start; gap: 0.8rem; margin-bottom: 0.6rem; }
  .book-icon { font-size: 2.2rem; flex-shrink: 0; }
  .book-info h3 { font-size: 0.9rem; font-weight: 700; margin-bottom: 2px; }
  .book-info .author { font-size: 0.72rem; color: var(--muted); }
  .book-read-badge { margin-left: auto; font-size: 0.65rem; background: rgba(74,222,128,0.1); color: var(--success); border: 1px solid rgba(74,222,128,0.3); padding: 3px 7px; border-radius: 7px; white-space: nowrap; flex-shrink: 0; }
  .book-card .lesson { font-size: 0.78rem; color: var(--muted); line-height: 1.5; font-style: italic; border-left: 3px solid var(--accent); padding-left: 10px; }
  #book-detail { display: none; position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; }
  #book-detail.show { display: flex; flex-direction: column; }
  .book-detail-header { padding: 1rem 1.2rem; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 0.8rem; }
  .book-detail-content { padding: 1.5rem 1.2rem; flex: 1; }
  .book-detail-content h1 { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 2px; margin-bottom: 0.3rem; }
  .book-detail-content .author { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.85rem; }
  .technique { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem 1.1rem; margin-bottom: 0.8rem; }
  .technique h4 { color: var(--accent); font-size: 0.8rem; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
  .technique p { font-size: 0.84rem; color: var(--muted); line-height: 1.6; }
  .btn-mark-read { margin-top: 1.2rem; width: 100%; padding: 13px; background: rgba(74,222,128,0.1); border: 1px solid rgba(74,222,128,0.3); color: var(--success); border-radius: var(--radius); cursor: pointer; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; letter-spacing: 2px; transition: all 0.2s; }
  .btn-mark-read:hover { background: rgba(74,222,128,0.2); }

  /* PROFILE */
  #profile-screen { padding: 0; }
  .profile-content { padding: 1.2rem; overflow-y: auto; flex: 1; padding-bottom: 90px; }
  .profile-hero { text-align: center; padding: 1.5rem 0; }
  .profile-avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 0.8rem; border: 3px solid rgba(255,107,43,0.3); }
  .profile-hero h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 2px; }
  .profile-hero p { color: var(--accent); font-size: 0.82rem; margin-top: 3px; }
  .achievements { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem; margin-top: 1.2rem; }
  .achievement { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.7rem; text-align: center; }
  .achievement.unlocked { border-color: rgba(255,215,0,0.3); background: rgba(255,215,0,0.05); }
  .achievement .ach-icon { font-size: 1.6rem; margin-bottom: 3px; filter: grayscale(1); }
  .achievement.unlocked .ach-icon { filter: none; }
  .achievement .ach-name { font-size: 0.6rem; color: var(--muted); }
  .achievement.unlocked .ach-name { color: var(--gold); }
  .history-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.8rem 1rem; margin-bottom: 0.6rem; display: flex; justify-content: space-between; align-items: center; }
  .history-item .h-title { font-size: 0.82rem; font-weight: 600; }
  .history-item .h-meta { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  .history-item .h-score { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--accent); }

  /* BOTTOM NAV */
  .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--border); display: flex; z-index: 10; }
  .nav-item { flex: 1; padding: 0.7rem 0.3rem; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; border: none; background: none; color: var(--muted); font-size: 0.6rem; font-family: 'DM Sans', sans-serif; font-weight: 500; letter-spacing: 0.5px; text-transform: uppercase; transition: color 0.2s; }
  .nav-item .nav-icon { font-size: 1.2rem; }
  .nav-item.active { color: var(--accent); }

  /* RESULT MODAL */
  #result-modal { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; padding: 1.5rem; }
  #result-modal.show { display: flex; }
  .result-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 1.8rem; width: 100%; max-width: 380px; text-align: center; animation: scaleIn 0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
  .result-card .score-ring { font-size: 3.5rem; margin: 0.8rem 0; }
  .result-card h2 { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; letter-spacing: 2px; margin-bottom: 0.4rem; }
  .result-card .score-val { font-family: 'JetBrains Mono', monospace; font-size: 2.8rem; color: var(--accent); font-weight: 700; }
  .result-card .score-label { color: var(--muted); font-size: 0.75rem; margin-bottom: 1.2rem; }
  .result-card .feedback { background: var(--surface2); border-radius: var(--radius); padding: 0.9rem; text-align: left; font-size: 0.82rem; color: var(--muted); line-height: 1.6; margin-bottom: 1.2rem; }
  .result-card .xp-earned { color: var(--gold); font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 2px; margin-bottom: 0.8rem; }
  .btn-continue { width: 100%; padding: 13px; background: linear-gradient(135deg, var(--accent), var(--accent2)); border: none; border-radius: var(--radius); color: #000; font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 2px; cursor: pointer; }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  @keyframes ripple { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
  @keyframes bounce { 0%, 100% { transform: translateY(0); opacity: 0.5; } 50% { transform: translateY(-5px); opacity: 1; } }
  @keyframes scaleIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
</style>
</head>
<body>

<!-- SETU
