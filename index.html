<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--surface:#13131a;--surface2:#1c1c26;--border:#2a2a3a;--accent:#ff6b2b;--accent2:#ffb347;--gold:#ffd700;--text:#f0f0f5;--muted:#7070a0;--success:#4ade80;--danger:#f87171;--r:12px;}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.active{display:flex;}

/* SETUP */
#setup-screen{align-items:center;justify-content:flex-start;padding:1.5rem 1.5rem 4rem;overflow-y:auto;background:radial-gradient(ellipse at 50% 0%,rgba(255,107,43,0.12) 0%,transparent 60%);}
.logo-area{text-align:center;margin-bottom:2rem;padding-top:0.5rem;width:100%;}
.badge{display:inline-block;background:rgba(255,107,43,0.15);border:1px solid rgba(255,107,43,0.4);color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:0.65rem;letter-spacing:3px;padding:5px 14px;border-radius:20px;margin-bottom:1rem;text-transform:uppercase;}
.logo-area h1{font-family:'Bebas Neue',sans-serif;font-size:clamp(3rem,10vw,5.5rem);letter-spacing:4px;line-height:1;background:linear-gradient(135deg,#fff 40%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.logo-area p{color:var(--muted);font-size:0.9rem;margin-top:0.5rem;}
.setup-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:2rem;width:100%;max-width:460px;}
.setup-card h2{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:2px;margin-bottom:0.3rem;}
.setup-card>p{color:var(--muted);font-size:0.82rem;margin-bottom:1.5rem;line-height:1.6;}
.fg{margin-bottom:1rem;}
.fg label{display:block;font-size:0.72rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem;}
.fg input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;color:var(--text);font-family:'JetBrains Mono',monospace;font-size:0.82rem;outline:none;transition:border-color 0.2s;}
.fg input:focus{border-color:var(--accent);}
.fg input::placeholder{color:var(--muted);}
.hint{font-size:0.72rem;color:var(--muted);margin-top:0.4rem;}
.hint a{color:var(--accent);text-decoration:none;}
.btn-main{width:100%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:2px;padding:14px;border:none;border-radius:var(--r);cursor:pointer;margin-top:1rem;}
.btn-main:hover{opacity:0.9;}

/* TOPBAR */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.2rem;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;z-index:10;}
.logo-sm{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:3px;background:linear-gradient(135deg,#fff,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.xp-pill{display:flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;padding:5px 12px;font-family:'JetBrains Mono',monospace;font-size:0.8rem;}
.xp-val{color:var(--gold);font-weight:700;}

/* HOME */
#home-screen{padding:0;}
.home-content{padding:1.2rem;flex:1;overflow-y:auto;padding-bottom:90px;}
.greeting{margin-bottom:1.5rem;}
.greeting h2{font-family:'Bebas Neue',sans-serif;font-size:2rem;letter-spacing:2px;line-height:1.1;}
.greeting p{color:var(--muted);font-size:0.85rem;margin-top:4px;}
.level-card{background:linear-gradient(135deg,rgba(255,107,43,0.1),rgba(255,179,71,0.05));border:1px solid rgba(255,107,43,0.3);border-radius:16px;padding:1.2rem;margin-bottom:1.2rem;}
.level-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.8rem;}
.level-name{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:2px;color:var(--accent);}
.level-badge{font-family:'JetBrains Mono',monospace;font-size:0.7rem;color:var(--gold);background:rgba(255,215,0,0.1);border:1px solid rgba(255,215,0,0.3);padding:3px 8px;border-radius:8px;}
.xp-bar-wrap{height:7px;background:var(--surface2);border-radius:10px;overflow:hidden;}
.xp-bar{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:10px;transition:width 0.5s;}
.xp-label{display:flex;justify-content:space-between;font-size:0.7rem;color:var(--muted);margin-top:5px;font-family:'JetBrains Mono',monospace;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:0.8rem;margin-bottom:1.5rem;}
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:0.8rem;text-align:center;}
.stat-icon{font-size:1.3rem;margin-bottom:3px;}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;}
.stat-lbl{font-size:0.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;}
.sec-title{font-family:'Bebas Neue',sans-serif;font-size:1rem;letter-spacing:2px;color:var(--muted);margin-bottom:0.8rem;}
.scenarios-grid{display:flex;flex-direction:column;gap:0.8rem;}
.scenario-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1rem 1.2rem;cursor:pointer;display:flex;align-items:center;gap:1rem;transition:border-color 0.2s,transform 0.2s;}
.scenario-card:hover{border-color:var(--accent);transform:translateX(4px);}
.sc-icon{font-size:1.8rem;flex-shrink:0;}
.sc-info{flex:1;}
.sc-info h3{font-size:0.9rem;font-weight:700;margin-bottom:2px;}
.sc-info p{font-size:0.75rem;color:var(--muted);line-height:1.4;}
.sc-meta{text-align:right;flex-shrink:0;}
.sc-xp{font-family:'JetBrains Mono',monospace;font-size:0.75rem;color:var(--gold);}
.sc-diff{font-size:0.65rem;color:var(--muted);margin-top:2px;}

/* CALL */
#call-screen{padding:0;}
.call-header{padding:1rem 1.2rem;border-bottom:1px solid var(--border);background:var(--surface);display:flex;align-items:center;gap:0.8rem;position:sticky;top:0;z-index:10;}
.btn-back{background:var(--surface2);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.call-hinfo{flex:1;}
.call-hinfo h3{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:2px;}
.call-hinfo p{font-size:0.7rem;color:var(--muted);}
.sdot{width:10px;height:10px;border-radius:50%;background:var(--muted);}
.sdot.live{background:var(--success);animation:pulse 1.5s infinite;}
.sdot.rec{background:var(--danger);animation:pulse 1s infinite;}
.call-body{flex:1;overflow-y:auto;padding:1.2rem;display:flex;flex-direction:column;gap:0.8rem;padding-bottom:210px;}
.p-avatar{text-align:center;padding:1.5rem 0 1rem;}
.av-circle{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:2.2rem;margin:0 auto 0.8rem;border:3px solid rgba(255,107,43,0.3);position:relative;}
.av-circle.speaking::after{content:'';position:absolute;inset:-8px;border-radius:50%;border:2px solid var(--accent);animation:ripple 1.5s infinite;}
.p-avatar h3{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;letter-spacing:2px;}
.p-avatar p{color:var(--muted);font-size:0.78rem;}
.msg{display:flex;max-width:85%;}
.msg.user{align-self:flex-end;flex-direction:row-reverse;}
.msg-bubble{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:0.7rem 1rem;font-size:0.87rem;line-height:1.5;}
.msg.user .msg-bubble{background:rgba(255,107,43,0.12);border-color:rgba(255,107,43,0.3);}
.msg-name{font-size:0.65rem;color:var(--muted);margin-bottom:3px;font-weight:700;letter-spacing:1px;text-transform:uppercase;}
.thinking{display:flex;gap:4px;padding:10px 14px;}
.thinking span{width:7px;height:7px;background:var(--muted);border-radius:50%;animation:bounce 1.2s infinite;}
.thinking span:nth-child(2){animation-delay:0.2s;}
.thinking span:nth-child(3){animation-delay:0.4s;}
.call-controls{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);padding:0.8rem 1.2rem 1.5rem;display:flex;flex-direction:column;gap:0.7rem;z-index:10;}
.transcript-bar{display:flex;align-items:center;gap:8px;padding:0.5rem 0.8rem;background:var(--surface2);border-radius:10px;font-size:0.78rem;color:var(--muted);min-height:34px;}
.live-text{flex:1;font-style:italic;color:var(--text);}
.vstatus{text-align:center;font-size:0.75rem;color:var(--muted);font-family:'JetBrains Mono',monospace;}
.ctrl-row{display:flex;align-items:center;justify-content:center;gap:1rem;}
.ctrl-btn{border:none;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all 0.2s;font-size:1.2rem;}
.ctrl-btn.sm{width:46px;height:46px;background:var(--surface2);border:1px solid var(--border);color:var(--text);}
.ctrl-btn.lg{width:68px;height:68px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#000;box-shadow:0 0 25px rgba(255,107,43,0.4);}
.ctrl-btn.lg.rec{background:linear-gradient(135deg,var(--danger),#ff4444);}
.ctrl-btn.endbtn{background:rgba(248,113,113,0.15);border:1px solid var(--danger);color:var(--danger);}
.text-row{display:flex;gap:8px;}
.text-row input{flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r);padding:10px 12px;color:var(--text);font-size:0.85rem;outline:none;}
.text-row input:focus{border-color:var(--accent);}
.text-row button{background:var(--accent);border:none;border-radius:var(--r);padding:10px 16px;color:#000;font-weight:700;cursor:pointer;}

/* BOOKS */
#books-screen{padding:0;}
.screen-hdr{padding:1rem 1.2rem;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0.8rem;}
.screen-hdr h2{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:2px;}
.books-content{padding:1.2rem;overflow-y:auto;flex:1;padding-bottom:90px;}
.book-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:1.1rem;margin-bottom:0.8rem;cursor:pointer;transition:border-color 0.2s;}
.book-card:hover{border-color:var(--accent);}
.book-card.read{border-color:rgba(74,222,128,0.4);}
.book-top{display:flex;align-items:flex-start;gap:0.8rem;margin-bottom:0.6rem;}
.book-icon{font-size:2.2rem;flex-shrink:0;}
.book-info h3{font-size:0.9rem;font-weight:700;margin-bottom:2px;}
.book-info .author{font-size:0.72rem;color:var(--muted);}
.read-badge{margin-left:auto;font-size:0.65rem;background:rgba(74,222,128,0.1);color:var(--success);border:1px solid rgba(74,222,128,0.3);padding:3px 7px;border-radius:7px;white-space:nowrap;flex-shrink:0;}
.lesson{font-size:0.78rem;color:var(--muted);line-height:1.5;font-style:italic;border-left:3px solid var(--accent);padding-left:10px;}
#book-detail{display:none;position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;flex-direction:column;}
#book-detail.show{display:flex;}
.book-dhdr{padding:1rem 1.2rem;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:0.8rem;}
.book-dbody{padding:1.5rem 1.2rem 3rem;}
.book-dbody h1{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;margin-bottom:0.2rem;}
.book-dbody .author{color:var(--muted);margin-bottom:1.5rem;font-size:0.85rem;}
.tech{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:0.9rem 1.1rem;margin-bottom:0.8rem;}
.tech h4{color:var(--accent);font-size:0.8rem;margin-bottom:5px;text-transform:uppercase;letter-spacing:1px;}
.tech p{font-size:0.84rem;color:var(--muted);line-height:1.6;}
.btn-read{margin-top:1.2rem;width:100%;padding:13px;background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.3);color:var(--success);border-radius:var(--r);cursor:pointer;font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:2px;}

/* PROFILE */
#profile-screen{padding:0;}
.profile-content{padding:1.2rem;overflow-y:auto;flex:1;padding-bottom:90px;}
.profile-hero{text-align:center;padding:1.5rem 0;}
.profile-av{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:1.8rem;margin:0 auto 0.8rem;border:3px solid rgba(255,107,43,0.3);}
.profile-hero h2{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:2px;}
.profile-hero p{color:var(--accent);font-size:0.82rem;margin-top:3px;}
.ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0.7rem;margin-top:1rem;}
.ach{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:0.7rem;text-align:center;}
.ach.on{border-color:rgba(255,215,0,0.3);background:rgba(255,215,0,0.05);}
.ach-icon{font-size:1.6rem;margin-bottom:3px;filter:grayscale(1);}
.ach.on .ach-icon{filter:none;}
.ach-name{font-size:0.6rem;color:var(--muted);}
.ach.on .ach-name{color:var(--gold);}
.hist-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:0.8rem 1rem;margin-bottom:0.6rem;display:flex;justify-content:space-between;align-items:center;}
.hi-title{font-size:0.82rem;font-weight:600;}
.hi-meta{font-size:0.7rem;color:var(--muted);margin-top:2px;}
.hi-score{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--accent);}

/* NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:10;}
.nav-btn{flex:1;padding:0.7rem 0.3rem;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:none;color:var(--muted);font-size:0.6rem;font-family:'DM Sans',sans-serif;font-weight:600;letter-spacing:0.5px;text-transform:uppercase;transition:color 0.2s;}
.nav-btn .ni{font-size:1.2rem;}
.nav-btn.active{color:var(--accent);}

/* RESULT */
#result-modal{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0.85);align-items:center;justify-content:center;padding:1.5rem;}
#result-modal.show{display:flex;}
.result-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:1.8rem;width:100%;max-width:380px;text-align:center;}
.res-emoji{font-size:3.5rem;margin:0.5rem 0;}
.result-card h2{font-family:'Bebas Neue',sans-serif;font-size:1.8rem;letter-spacing:2px;}
.res-score{font-family:'JetBrains Mono',monospace;font-size:3rem;color:var(--accent);font-weight:700;}
.res-label{color:var(--muted);font-size:0.75rem;margin-bottom:1.2rem;}
.res-feedback{background:var(--surface2);border-radius:var(--r);padding:0.9rem;text-align:left;font-size:0.82rem;color:var(--muted);line-height:1.6;margin-bottom:1.2rem;}
.res-xp{color:var(--gold);font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:2px;margin-bottom:0.8rem;}
.btn-continue{width:100%;padding:13px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:var(--r);color:#000;font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:2px;cursor:pointer;}
